services:
  ollama:
    build:
      context: ./ollama
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
      - ./models:/models
    networks:
      - loma-network
    environment:
      - OLLAMA_NUM_THREADS=8
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]